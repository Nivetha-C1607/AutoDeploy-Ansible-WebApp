
name: AutoDeploy Demo Application

on:
  workflow_dispatch:
    inputs:
      deployment_target:
        description: "Choose the deployment target"
        required: true
        type: choice
        options:
          - demo
          - test
        default: demo
      deployment_note:
        description: "Optional note for this deployment"
        required: false
        type: string
        default: "Triggered manually"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Show deployment request
        run: |
          echo "Target: ${{ inputs.deployment_target }}"
          echo "Note: ${{ inputs.deployment_note }}"

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Run Ansible deployment
        run: |
          ansible-playbook deploy.yml

      - name: Verify deployed application
        run: |
          test -f deployed_site/index.html
          echo "AutoDeploy completed successfully!"
